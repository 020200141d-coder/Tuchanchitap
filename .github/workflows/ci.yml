# ============================================================================
#  .github/workflows/ci.yml — integración continua (GitHub Actions, gratis)
#
#  En cada push o pull request:
#   • backend: instala, corre Jest + Supertest con cobertura (falla si los
#     servicios bajan de 70 %) y guarda el reporte como artefacto.
#   • frontend: verifica que React compile.
#  Las pruebas usan la base en memoria: no hacen falta secretos ni PostgreSQL.
# ============================================================================

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run cobertura
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/lcov-report

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
